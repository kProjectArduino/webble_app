<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Air & Window Hub</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #f0f4fd 0%, #e2ebf9 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --primary: #3b82f6;
      --primary-soft: #eff6ff;
      --accent-sky: #0ea5e9;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      --card-shadow: 0 16px 36px rgba(148, 163, 184, 0.18), 0 2px 6px rgba(148, 163, 184, 0.08);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .controller-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      padding: 26px 22px;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--card-shadow);
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #0f172a;
    }

    .title-group span {
      font-size: 11px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-red);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
      transition: all 0.3s;
    }

    .dot.connected {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .btn-connect {
      width: 100%;
      padding: 13px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #0284c7 100%);
      color: white;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.25);
      transition: all 0.2s;
      margin-bottom: 16px;
    }

    .btn-connect:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.2);
    }

    .btn-disconnect {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fecaca;
      box-shadow: none;
      display: none;
    }

    /* 그래픽 창문 뷰어 */
    .window-visualizer {
      width: 100%;
      height: 150px;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 70%, #f0fdf4 100%);
      border-radius: 20px;
      border: 4px solid #cbd5e1;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      margin-bottom: 14px;
    }

    .scenery {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 26px;
      filter: drop-shadow(0 2px 4px rgba(253, 224, 71, 0.5));
      transition: all 0.5s;
    }

    .window-pane {
      width: 50%;
      height: 100%;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      border: 3px solid #94a3b8;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pane-left {
      border-right: 2px solid #64748b;
      transform-origin: left;
    }

    .pane-right {
      border-left: 2px solid #64748b;
      transform-origin: right;
    }

    .pane-grid {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(148, 163, 184, 0.6);
    }

    .window-visualizer.open .pane-left { transform: translateX(-75%); }
    .window-visualizer.open .pane-right { transform: translateX(75%); }

    /* 원인 및 상태 복합 배지 */
    .window-status-pill {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.82);
      color: white;
      padding: 5px 14px;
      border-radius: 14px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .cause-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      color: #e0f2fe;
    }

    /* 센서 그리드 */
    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }

    .sensor-card {
      background: #ffffff;
      border: 1px solid #edf2f7;
      border-radius: 18px;
      padding: 13px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .sensor-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sensor-status-main {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.4px;
      margin-top: 2px;
      line-height: 1.3;
    }

    .sensor-value-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .alert-text {
      color: var(--accent-red) !important;
    }

    /* 모드 선택 바 */
    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .btn-mode {
      padding: 9px 0;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mode.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    /* 수동 동작 버튼 */
    .manual-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }

    .btn-action {
      padding: 12px 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
    }

    .btn-action svg { stroke-width: 2.2; }

    .btn-action:active {
      transform: translateY(2px) scale(0.97);
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-action.stop-action {
      color: var(--accent-red);
      background: #fff5f5;
      border-color: #fee2e2;
    }

    .btn-action.stop-action:active { background: #fecaca; }

    /* 로그 터미널 */
    .terminal {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 9px 12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .terminal-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-sky);
      border-radius: 50%;
    }

    .terminal-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guide-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-sub);
    }

    .guide-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="controller-card">
    <div class="header">
      <div class="title-group">
        <h1>SMART WINDOW</h1>
        <span>BLE Environmental Hub</span>
      </div>
      <div class="status-badge">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">연결 대기</span>
      </div>
    </div>

    <!-- 기기 연결/해제 -->
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      창문 기기 검색 및 연결
    </button>
    <button id="btnDisconnect" class="btn-connect btn-disconnect" onclick="disconnectBLE()">
      연결 해제
    </button>

    <!-- 그래픽 창문 뷰어 및 상태/원인 배지 -->
    <div id="windowBox" class="window-visualizer">
      <div id="sceneryIcon" class="scenery">☀️</div>
      <div class="window-pane pane-left"><div class="pane-grid"></div></div>
      <div class="window-pane pane-right"><div class="pane-grid"></div></div>
      
      <div id="windowStateBadge" class="window-status-pill">
        <span id="causeTag" class="cause-tag">대기</span>
        <span id="statusDesc">상태 확인 중</span>
      </div>
    </div>

    <!-- 실시간 센서 카드 그리드 -->
    <div class="sensor-grid">
      <div class="sensor-card">
        <div class="sensor-label">실내 공기 <span>🌡️</span></div>
        <div class="sensor-status-main" id="tempStatus">측정 대기</div>
        <div class="sensor-value-sub"><span id="valTemp">--</span>°C / <span id="valHumi">--</span>%</div>
      </div>

      <div class="sensor-card">
        <div class="sensor-label">날씨 / 강수 <span>🌧️</span></div>
        <div class="sensor-status-main" id="rainStatus">측정 대기</div>
        <div class="sensor-value-sub">센서값: <span id="valRain">--</span></div>
      </div>

      <div class="sensor-card">
        <div class="sensor-label">가스 안전 <span>⚠️</span></div>
        <div class="sensor-status-main" id="gasStatus">측정 대기</div>
        <div class="sensor-value-sub">수치: <span id="valGas">--</span></div>
      </div>

      <div class="sensor-card">
        <div class="sensor-label">주변 밝기 <span>💡</span></div>
        <div class="sensor-status-main" id="cdsStatus">측정 대기</div>
        <div class="sensor-value-sub">조도: <span id="valCds">--</span></div>
      </div>
    </div>

    <!-- 모드 선택 바 -->
    <div class="mode-selector">
      <button id="btnModeAuto" class="btn-mode" onclick="setWindowMode('3')">🤖 자동 모드</button>
      <button id="btnModeManual" class="btn-mode active" onclick="setWindowMode('4')">🖐 수동 모드</button>
    </div>

    <!-- 수동 제어 버튼 -->
    <div class="manual-actions">
      <button class="btn-action" onclick="sendActionCommand('1')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 15l-6-6-6 6"/></svg>
        열기
      </button>
      <button class="btn-action stop-action" onclick="sendActionCommand('0')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        정지
      </button>
      <button class="btn-action" onclick="sendActionCommand('2')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg>
        닫기
      </button>
    </div>

    <!-- 로그 터미널 -->
    <div class="terminal">
      <div class="terminal-dot"></div>
      <div id="logText" class="terminal-text">System ready. Waiting for connection...</div>
    </div>

    <div class="guide-box">
      <div class="guide-title">ℹ 접속 환경 안내</div>
      <div>• <b>Android / PC</b>: Chrome, Edge 브라우저</div>
      <div>• <b>iPhone / iPad (iOS)</b>: Bluefy 또는 WebBLE 브라우저 앱 접속</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleCharacteristic = null;
    let rxBuffer = [];

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const logText = document.getElementById('logText');

    const windowBox = document.getElementById('windowBox');
    const causeTag = document.getElementById('causeTag');
    const statusDesc = document.getElementById('statusDesc');
    const sceneryIcon = document.getElementById('sceneryIcon');

    const btnModeAuto = document.getElementById('btnModeAuto');
    const btnModeManual = document.getElementById('btnModeManual');

    // 원인 코드별 텍스트 매핑 테이블
    const REASON_MAP = {
      0: { tag: "대기", text: "상태 없음", open: false },
      1: { tag: "수동 제어", text: "수동으로 열림", open: true },
      2: { tag: "수동 제어", text: "수동으로 닫힘", open: false },
      3: { tag: "가스 누출", text: "가스 감지로 환기 열림", open: true },
      4: { tag: "우천 감지", text: "빗물 유입 방지 닫힘", open: false },
      5: { tag: "조도 센서", text: "야간 어두움으로 닫힘", open: false },
      6: { tag: "온도 상승", text: "실내 더위로 환기 열림", open: true },
      7: { tag: "온도 저하", text: "냉기 차단으로 닫힘", open: false }
    };

    function log(msg) {
      logText.innerText = msg;
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(15);
    }

    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert("이 브라우저는 Web Bluetooth API를 지원하지 않습니다.\n(Android: Chrome / iOS: Bluefy 앱 권장)");
        return;
      }

      try {
        log("BLE 기기 검색 중...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("GATT 서버 연결 중...");
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', handleSensorData);

        statusDot.classList.add('connected');
        statusText.innerText = "ONLINE";
        statusText.style.color = "var(--accent-green)";
        btnConnect.style.display = "none";
        btnDisconnect.style.display = "flex";

        log(`연결 완료: ${bleDevice.name || 'Window System'}`);
        triggerHaptic();
      } catch (error) {
        log(`연결 실패: ${error.message}`);
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        onDisconnected();
      }
    }

    function onDisconnected() {
      statusDot.classList.remove('connected');
      statusText.innerText = "연결 대기";
      statusText.style.color = "var(--text-sub)";
      btnConnect.style.display = "flex";
      btnDisconnect.style.display = "none";
      bleCharacteristic = null;
      rxBuffer = [];
      log("장치 연결이 해제되었습니다.");
    }

    async function sendWindowPacket(cmdChar) {
      if (!bleCharacteristic) {
        log("블루투스가 연결되지 않았습니다.");
        return;
      }

      try {
        const payload = new Uint8Array([20, cmdChar.charCodeAt(0)]);
        if (bleCharacteristic.properties.writeWithoutResponse) {
          await bleCharacteristic.writeValueWithoutResponse(payload);
        } else {
          await bleCharacteristic.writeValue(payload);
        }
        log(`TX >> [Header:20, Cmd:'${cmdChar}']`);
      } catch (err) {
        log(`TX 실패: ${err.message}`);
      }
    }

    function sendActionCommand(cmd) {
      triggerHaptic();
      sendWindowPacket(cmd);
      setModeUI(false);

      if (cmd === '1') {
        updateWindowView(1);
      } else if (cmd === '2') {
        updateWindowView(2);
      } else if (cmd === '0') {
        causeTag.innerText = "수동";
        statusDesc.innerText = "동작 정지";
      }
    }

    function setWindowMode(modeCmd) {
      triggerHaptic();
      sendWindowPacket(modeCmd);
      setModeUI(modeCmd === '3');
    }

    function setModeUI(isAuto) {
      if (isAuto) {
        btnModeAuto.classList.add('active');
        btnModeManual.classList.remove('active');
      } else {
        btnModeManual.classList.add('active');
        btnModeAuto.classList.remove('active');
      }
    }

    // 창문 비주얼 및 원인 텍스트 갱신 함수
    function updateWindowView(reasonCode) {
      const info = REASON_MAP[reasonCode] || { tag: "알수없음", text: "상태 확인", open: false };
      causeTag.innerText = info.tag;
      statusDesc.innerText = info.text;

      if (info.open) {
        windowBox.classList.add('open');
      } else {
        windowBox.classList.remove('open');
      }
    }

    // 센서 패킷 수신 (총 11바이트: 헤더 + 9바이트 데이터 + 테일)
    function handleSensorData(event) {
      const value = event.target.value;
      for (let i = 0; i < value.byteLength; i++) {
        rxBuffer.push(value.getUint8(i));
      }

      while (rxBuffer.length >= 11) {
        if (rxBuffer[0] !== 20) {
          rxBuffer.shift();
          continue;
        }

        if (rxBuffer[10] === 21) {
          const temp = rxBuffer[1];
          const humi = rxBuffer[2];
          const rain = rxBuffer[3] | (rxBuffer[4] << 8);
          const gas = rxBuffer[5] | (rxBuffer[6] << 8);
          const cds = rxBuffer[7] | (rxBuffer[8] << 8);
          const reason = rxBuffer[9]; // 원인 코드 바이트

          updateDashboard(temp, humi, rain, gas, cds, reason);
          rxBuffer.splice(0, 11);
        } else {
          rxBuffer.shift();
        }
      }
    }

    function updateDashboard(temp, humi, rain, gas, cds, reason) {
      document.getElementById('valTemp').innerText = temp;
      document.getElementById('valHumi').innerText = humi;
      document.getElementById('valRain').innerText = rain;
      document.getElementById('valGas').innerText = gas;
      document.getElementById('valCds').innerText = cds;

      // 1. 창문 상태 및 개폐 원인 갱신
      if (reason > 0) {
        updateWindowView(reason);
      }

      // 2. 강수 센서 상태
      const rainStatus = document.getElementById('rainStatus');
      if (rain < 500) {
        rainStatus.innerText = "🌧️ 비 감지됨";
        rainStatus.classList.add('alert-text');
        sceneryIcon.innerText = "🌧️";
      } else {
        rainStatus.innerText = "맑음 (비 없음)";
        rainStatus.classList.remove('alert-text');
      }

      // 3. 가스 센서 상태
      const gasStatus = document.getElementById('gasStatus');
      if (gas >= 200) {
        gasStatus.innerText = "⚠️ 가스 감지됨";
        gasStatus.classList.add('alert-text');
      } else {
        gasStatus.innerText = "정상 (안전)";
        gasStatus.classList.remove('alert-text');
      }

      // 4. 조도 센서 상태
      const cdsStatus = document.getElementById('cdsStatus');
      if (cds > 500) {
        cdsStatus.innerText = "어두움 (야간)";
        if (rain >= 500) sceneryIcon.innerText = "🌙";
      } else {
        cdsStatus.innerText = "밝음 (주간)";
        if (rain >= 500) sceneryIcon.innerText = "☀️";
      }

      // 5. 온도 센서 상태
      const tempStatus = document.getElementById('tempStatus');
      if (temp >= 30) {
        tempStatus.innerText = "더움 (환기)";
        tempStatus.classList.add('alert-text');
      } else if (temp <= 10) {
        tempStatus.innerText = "추움 (보온)";
        tempStatus.classList.remove('alert-text');
      } else {
        tempStatus.innerText = "쾌적한 실내";
        tempStatus.classList.remove('alert-text');
      }
    }
  </script>
</body>
</html>
