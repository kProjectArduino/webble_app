<!-- 파일이름 : index.html -->
<!-- 사용버전: HTML5, Web Bluetooth API, DeviceOrientation Event API, Screen Wake Lock API, Screen Orientation API -->
<!-- 공지사항: HTTPS 또는 localhost 환경에서 실행해야 BLE, 센서 권한 및 Wake Lock이 정상 작동합니다. -->
<!-- 리비전: Rev 1.1.0 (화면 방향 고정 및 Fullscreen 동기화 개선) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>아두이노 BLE RC 카 컨트롤러</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .controller-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group span {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .dot.connected {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .btn-connect {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .btn-connect:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.2);
    }

    .btn-disconnect {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: none;
      display: none;
    }

    /* 자이로 센서 제어 버튼 */
    .btn-gyro {
      width: 100%;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .btn-gyro.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      border-color: transparent;
    }

    /* 화면 방향 고정 버튼 */
    .btn-orientation {
      width: 100%;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .btn-orientation.active {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      border-color: transparent;
    }

    /* D-PAD 컨트롤 영역 */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 16px;
      touch-action: none;
    }

    .btn-ctrl {
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      color: #e2e8f0;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.1s ease;
      touch-action: none;
    }

    .btn-ctrl span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sub);
      pointer-events: none;
    }

    .btn-ctrl:active, .btn-ctrl.active {
      transform: translateY(3px) scale(0.96);
      background: linear-gradient(145deg, var(--accent-blue), #2563eb);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 2px 4px rgba(0, 0, 0, 0.3);
      color: white;
    }

    .btn-ctrl:active span, .btn-ctrl.active span {
      color: rgba(255, 255, 255, 0.9);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-center-stop {
      grid-column: 2;
      grid-row: 2;
      background: rgba(15, 23, 42, 0.8);
      border-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 12px;
      cursor: default;
    }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 3; }

    /* 로그 & 단말기 터미널 */
    .terminal {
      width: 100%;
      background: rgba(10, 15, 29, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 11px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .terminal-dot {
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .terminal-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 권장 브라우저 안내 */
    .guide-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background-color: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-sub);
    }

    .guide-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .highlight { color: #60a5fa; font-weight: 600; }
    .highlight-ios { color: #f472b6; font-weight: 600; }

    .revision-badge {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="controller-card">
    <div class="header">
      <div class="title-group">
        <h1>ARDUINO CAR</h1>
        <span>BLE Controller</span>
      </div>
      <div class="status-badge">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">DISCONNECTED</span>
      </div>
    </div>

    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      기기 검색 및 연결
    </button>
    <button id="btnDisconnect" class="btn-connect btn-disconnect" onclick="disconnectBLE()">
      연결 해제
    </button>

    <!-- 자이로 모드 토글 버튼 -->
    <button id="btnGyro" class="btn-gyro" onclick="toggleGyroControl()">
      📱 스마트폰 기울기 제어 OFF
    </button>

    <!-- 화면 방향 고정 버튼 -->
    <button id="btnOrientation" class="btn-orientation" onclick="toggleScreenOrientation()">
      🔄 화면 세로 고정 OFF
    </button>

    <!-- 4방향 D-PAD -->
    <div class="d-pad">
      <button class="btn-ctrl btn-up" data-cmd="8">▲<span>전진 (8)</span></button>
      <button class="btn-ctrl btn-left" data-cmd="4">◀<span>좌회전 (4)</span></button>
      <div class="btn-ctrl btn-center-stop"><span>홀드 제어<br>떼면 정지</span></div>
      <button class="btn-ctrl btn-right" data-cmd="6">▶<span>우회전 (6)</span></button>
      <button class="btn-ctrl btn-down" data-cmd="2">▼<span>후진 (2)</span></button>
    </div>

    <!-- 상태 출력 터미널 -->
    <div class="terminal">
      <div class="terminal-dot"></div>
      <div id="logText" class="terminal-text">System ready. Waiting for connection...</div>
    </div>

    <!-- 브라우저 안내 -->
    <div class="guide-box">
      <div class="guide-title">ℹ️ 플랫폼별 권장 브라우저</div>
      <div>• <span class="highlight">PC / 안드로이드</span>: <b>Google Chrome</b>, <b>Edge</b></div>
      <div>• <span class="highlight-ios">아이폰 / 아이패드</span>: <b>Bluefy</b> 앱 설치 후 접속</div>
      <div style="color: #64748b; font-size: 10.5px; margin-top: 4px;">* 반드시 <b>HTTPS</b> 또는 <b>localhost</b> 환경에서 실행해야 합니다.</div>
      <div style="color: #64748b; font-size: 10.5px; margin-top: 2px;">* 화면 방향 고정은 <b>전체화면(Fullscreen)</b> 진입과 함께 적용됩니다.</div>
    </div>

    <!-- 리비전 번호 표시 -->
    <div class="revision-badge">REVISION 1.1.0</div>
  </div>

  <script>
    // 128비트 표준 UUID 지정 (HM-10, AT-09, JDY 계열 기본값)
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleCharacteristic = null;
    let isPressed = false;
    let activeKey = null;

    // 기울기 제어 변수
    let gyroEnabled = false;
    let currentGyroCmd = '5';
    let wakeLock = null;

    // 화면 고정 상태 변수
    let orientationLocked = false;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnGyro = document.getElementById('btnGyro');
    const btnOrientation = document.getElementById('btnOrientation');
    const logText = document.getElementById('logText');

    function log(msg) {
      logText.innerText = msg;
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    // 1. 화면 꺼짐 방지 (Wake Lock API)
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          log("화면 꺼짐 방지(Wake Lock)가 활성화되었습니다.");
        } catch (err) {
          log(`Wake Lock 설정 실패: ${err.message}`);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => {
          wakeLock = null;
        });
      }
    }

    // 앱이 다시 활성화되었을 때 Wake Lock 재요청
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // 2. 전체화면 제어 헬퍼 (Screen Orientation Lock의 선행 조건)
    async function enterFullscreen() {
      const elem = document.documentElement;
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFullscreen) {
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        }
      }
    }

    async function exitFullscreen() {
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFullscreen) {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        }
      }
    }

    // 3. 화면 방향 고정 (Screen Orientation API + Fullscreen)
    async function lockScreenOrientation() {
      if (!screen.orientation || !screen.orientation.lock) {
        log("화면 방향 고정 API를 지원하지 않는 브라우저/환경입니다.");
        return;
      }

      try {
        // 브라우저 정책: orientation.lock은 Fullscreen 모드에서만 동작
        await enterFullscreen();
        await screen.orientation.lock('portrait');
        
        orientationLocked = true;
        if (btnOrientation) {
          btnOrientation.classList.add('active');
          btnOrientation.innerText = '🔒 화면 세로 고정 ON';
        }
        log("화면이 세로 방향으로 고정되었습니다. (전체화면)");
      } catch (err) {
        orientationLocked = false;
        if (btnOrientation) {
          btnOrientation.classList.remove('active');
          btnOrientation.innerText = '🔄 화면 세로 고정 OFF';
        }
        log(`화면 고정 실패: ${err.message}`);
      }
    }

    async function unlockScreenOrientation() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        await exitFullscreen();
      } catch (e) {}

      orientationLocked = false;
      if (btnOrientation) {
        btnOrientation.classList.remove('active');
        btnOrientation.innerText = '🔄 화면 세로 고정 OFF';
      }
      log("화면 고정이 해제되었습니다.");
    }

    async function toggleScreenOrientation() {
      if (!orientationLocked) {
        await lockScreenOrientation();
      } else {
        await unlockScreenOrientation();
      }
    }

    // 사용자가 뒤로가기/제스처로 전체화면을 벗어났을 때 상태 동기화
    function handleFullscreenChange() {
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFullscreen && orientationLocked) {
        if (screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
        orientationLocked = false;
        if (btnOrientation) {
          btnOrientation.classList.remove('active');
          btnOrientation.innerText = '🔄 화면 세로 고정 OFF';
        }
        log("전체화면 종료로 화면 고정이 해제되었습니다.");
      }
    }

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

    // 4. BLE 연결 관리
    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert("현재 브라우저는 Web Bluetooth를 지원하지 않습니다.\n안드로이드/PC는 Chrome, iOS는 Bluefy 앱을 사용해 주세요.");
        return;
      }

      try {
        log("BLE 기기 검색 중...");
        
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("GATT 서버 연결 시도...");
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        statusDot.classList.add('connected');
        statusText.innerText = bleDevice.name ? bleDevice.name.toUpperCase() : "CONNECTED";
        statusText.style.color = "var(--accent-green)";
        btnConnect.style.display = "none";
        btnDisconnect.style.display = "flex";

        log(`연결 성공: ${bleDevice.name || 'Device'}`);
        triggerHaptic();
        
        await requestWakeLock();
      } catch (error) {
        log(`연결 실패: ${error.message}`);
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        onDisconnected();
      }
    }

    function onDisconnected() {
      statusDot.classList.remove('connected');
      statusText.innerText = "DISCONNECTED";
      statusText.style.color = "var(--text-sub)";
      btnConnect.style.display = "flex";
      btnDisconnect.style.display = "none";
      bleCharacteristic = null;
      releaseWakeLock();
      log("장치 연결이 해제되었습니다.");
    }

    async function sendCommand(cmd) {
      if (!bleCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(cmd);

        if (bleCharacteristic.properties && bleCharacteristic.properties.writeWithoutResponse) {
          await bleCharacteristic.writeValueWithoutResponse(data);
        } else {
          await bleCharacteristic.writeValue(data);
        }
        log(`TX >> '${cmd}'`);
      } catch (err) {
        log(`TX Error: ${err.message}`);
      }
    }

    // 5. 스마트폰 자이로 센서 제어
    async function toggleGyroControl() {
      if (!gyroEnabled) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const response = await DeviceOrientationEvent.requestPermission();
            if (response !== 'granted') {
              alert('자이로 센서 접근 권한이 거부되었습니다.');
              return;
            }
          } catch (e) {
            log(`자이로 권한 에러: ${e.message}`);
            return;
          }
        }

        window.addEventListener('deviceorientation', handleOrientation);
        gyroEnabled = true;
        btnGyro.classList.add('active');
        btnGyro.innerText = '📱 스마트폰 기울기 제어 ON';
        await requestWakeLock();
        log("기울기 제어 모드가 활성화되었습니다.");
      } else {
        window.removeEventListener('deviceorientation', handleOrientation);
        gyroEnabled = false;
        btnGyro.classList.remove('active');
        btnGyro.innerText = '📱 스마트폰 기울기 제어 OFF';
        updateUIAndSend('5');
        log("기울기 제어 모드가 비활성화되었습니다.");
      }
    }

    function handleOrientation(event) {
      if (!gyroEnabled) return;

      const beta = event.beta;   // 전후 기울기 (-180 ~ 180)
      const gamma = event.gamma; // 좌우 기울기 (-90 ~ 90)

      let nextCmd = '5';

      if (beta > 15) {
        nextCmd = '2'; // 후진
      } else if (beta < -15) {
        nextCmd = '8'; // 전진
      } else if (gamma < -15) {
        nextCmd = '4'; // 좌회전
      } else if (gamma > 15) {
        nextCmd = '6'; // 우회전
      } else {
        nextCmd = '5'; // 정지
      }

      if (currentGyroCmd !== nextCmd) {
        currentGyroCmd = nextCmd;
        updateUIAndSend(nextCmd);
      }
    }

    function updateUIAndSend(cmd) {
      document.querySelectorAll('.btn-ctrl[data-cmd]').forEach(b => b.classList.remove('active'));
      if (cmd !== '5') {
        const targetBtn = document.querySelector(`.btn-ctrl[data-cmd="${cmd}"]`);
        if (targetBtn) targetBtn.classList.add('active');
      }
      sendCommand(cmd);
    }

    // 6. 터치 및 키보드 입력 핸들러
    document.querySelectorAll('.btn-ctrl[data-cmd]').forEach(btn => {
      const cmd = btn.getAttribute('data-cmd');

      const handlePress = (e) => {
        e.preventDefault();
        if (isPressed) return;
        isPressed = true;
        btn.classList.add('active');
        triggerHaptic();
        sendCommand(cmd);
      };

      const handleRelease = (e) => {
        e.preventDefault();
        if (!isPressed) return;
        isPressed = false;
        btn.classList.remove('active');
        sendCommand('5');
      };

      btn.addEventListener('pointerdown', handlePress);
      btn.addEventListener('pointerup', handleRelease);
      btn.addEventListener('pointerleave', handleRelease);
      btn.addEventListener('pointercancel', handleRelease);
    });

    const keyMap = {
      'ArrowUp': { cmd: '8', selector: '.btn-up' },
      '8': { cmd: '8', selector: '.btn-up' },
      'ArrowDown': { cmd: '2', selector: '.btn-down' },
      '2': { cmd: '2', selector: '.btn-down' },
      'ArrowLeft': { cmd: '4', selector: '.btn-left' },
      '4': { cmd: '4', selector: '.btn-left' },
      'ArrowRight': { cmd: '6', selector: '.btn-right' },
      '6': { cmd: '6', selector: '.btn-right' }
    };

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const target = keyMap[e.key];
      if (target && !activeKey) {
        activeKey = e.key;
        const btn = document.querySelector(target.selector);
        if (btn) btn.classList.add('active');
        sendCommand(target.cmd);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === activeKey) {
        const target = keyMap[e.key];
        if (target) {
          const btn = document.querySelector(target.selector);
          if (btn) btn.classList.remove('active');
        }
        activeKey = null;
        sendCommand('5');
      }
    });
  </script>
</body>
</html>
