<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLE Controller Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--text-sub);
    }

    /* HTML 파일 카드 리스트 */
    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .repo-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .repo-card:active {
      transform: scale(0.98);
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-blue);
    }

    .repo-info h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .repo-info p {
      margin: 0;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .arrow-icon {
      color: var(--accent-cyan);
      font-size: 18px;
      font-weight: bold;
    }

    /* 상태 메시지 */
    .state-msg {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>kProject Arduino Hub</h1>
      <p>실행할 컨트롤러 웹 앱을 선택하세요</p>
    </div>

    <div id="repoList" class="repo-list">
      <div class="state-msg">HTML 목록을 불러오는 중...</div>
    </div>
  </div>

  <script>
    const OWNER = 'kProjectArduino';
    const REPO = 'webble_app';

    async function loadHtmlFiles() {
      const listContainer = document.getElementById('repoList');

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const files = await res.json();

        // 1. .html 파일 필터링
        // 2. index.html 파일 제외
        const htmlFiles = files.filter(file => 
          file.type === 'file' && 
          file.name.toLowerCase().endsWith('.html') && 
          file.name.toLowerCase() !== 'index.html'
        );

        if (htmlFiles.length === 0) {
          listContainer.innerHTML = '<div class="state-msg">등록된 컨트롤러 파일이 없습니다.</div>';
          return;
        }

        listContainer.innerHTML = '';

        htmlFiles.forEach(file => {
          const card = document.createElement('a');
          card.className = 'repo-card';
          card.href = `./${file.name}`;

          // 파일명에서 확장자를 제거하고 언더바를 공백으로 치환
          const title = file.name.replace(/\.html$/i, '').replace(/_/g, ' ');

          card.innerHTML = `
            <div class="repo-info">
              <h2>${title}</h2>
              <p>${file.name}</p>
            </div>
            <div class="arrow-icon">➔</div>
          `;
          listContainer.appendChild(card);
        });

      } catch (err) {
        listContainer.innerHTML = '<div class="state-msg">목록을 불러오는 중 오류가 발생했습니다.<br><small style="opacity:0.7;">(GitHub API 요청 제한 또는 네트워크 확인 필요)</small></div>';
        console.error('GitHub API Fetch Error:', err);
      }
    }

    loadHtmlFiles();
  </script>
</body>
</html>
