<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLE Controller Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--text-sub);
    }

    /* 레포지토리 카드 리스트 */
    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .repo-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .repo-card:active {
      transform: scale(0.98);
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-blue);
    }

    .repo-info h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .repo-info p {
      margin: 0;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .arrow-icon {
      color: var(--accent-cyan);
      font-size: 18px;
      font-weight: bold;
    }

    /* 로딩 및 빈 목록 상태 */
    .state-msg {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>kProject Arduino Hub</h1>
      <p>실행할 컨트롤러 앱을 선택하세요</p>
    </div>

    <div id="repoList" class="repo-list">
      <div class="state-msg">앱 목록을 불러오는 중...</div>
    </div>
  </div>

  <script>
    const USERNAME = 'kprojectarduino';

    async function loadRepositories() {
      const listContainer = document.getElementById('repoList');

      try {
        // GitHub Public API를 통해 계정의 모든 레포지토리 목록 조회
        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const repos = await res.json();

        // 1. Pages가 켜져 있는 레포지토리 필터링 (메인 허브 자신 제외)
        // 2. 또는 특정 단어/토픽으로만 필터링도 가능
        const appRepos = repos.filter(repo => 
          repo.has_pages && repo.name.toLowerCase() !== `${USERNAME.toLowerCase()}.github.io`
        );

        if (appRepos.length === 0) {
          listContainer.innerHTML = '<div class="state-msg">배포된 GitHub Pages 앱이 없습니다.</div>';
          return;
        }

        listContainer.innerHTML = '';

        appRepos.forEach(repo => {
          const card = document.createElement('a');
          card.className = 'repo-card';
          // Pages 실제 접속 URL 설정
          card.href = `https://${USERNAME}.github.io/${repo.name}/`;

          const desc = repo.description || '아두이노 BLE 웹 제어 컨트롤러';

          card.innerHTML = `
            <div class="repo-info">
              <h2>${repo.name}</h2>
              <p>${desc}</p>
            </div>
            <div class="arrow-icon">➔</div>
          `;
          listContainer.appendChild(card);
        });

      } catch (err) {
        listContainer.innerHTML = '<div class="state-msg">목록을 불러오는 중 오류가 발생했습니다.</div>';
        console.error(err);
      }
    }

    loadRepositories();
  </script>
</body>
</html>
